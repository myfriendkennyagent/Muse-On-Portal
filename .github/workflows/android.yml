name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Protocol tests (byte-for-byte against Meta's reference)
        run: ./gradlew --no-daemon :protocol:test

      - name: App unit tests and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Shell scripts
        run: shellcheck tools/*.sh

      - uses: actions/upload-artifact@v4
        with:
          name: muse-on-portal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
